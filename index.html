<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onam • Coded in CSS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 55%,#fff4c9 0,#f8d98b 35%,#174b35 100%);
  font-family:Georgia,"Noto Serif Malayalam",serif;
  color:#fff;
}

/* ---------- CHECKBOX CONTROL ---------- */

#open{
  display:none;
}

/* ---------- MAIN SCENE ---------- */

.scene{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* Kerala sunset glow */

.sky{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 65%,
      rgba(255,230,150,.9),
      transparent 28%),
    linear-gradient(#073d2c,#126044 55%,#062e23);
  z-index:-5;
}

/* ---------- COCONUT TREES ---------- */

.palm{
  position:absolute;
  bottom:-5px;
  width:10px;
  height:65vh;
  background:#39291c;
  border-radius:50%;
  transform-origin:bottom;
  opacity:.8;
}

.palm.left{
  left:7%;
  transform:rotate(9deg);
}

.palm.right{
  right:7%;
  transform:rotate(-9deg);
}

.palm:before,
.palm:after{
  content:"";
  position:absolute;
  width:150px;
  height:30px;
  background:
    repeating-linear-gradient(
      90deg,
      #174f2e 0 8px,
      transparent 8px 14px
    );
  border-radius:100%;
  top:-10px;
}

.palm:before{
  left:-125px;
  transform:rotate(-20deg);
}

.palm:after{
  right:-125px;
  transform:rotate(20deg);
}

/* ---------- FIREFLIES ---------- */

.spark{
  position:absolute;
  width:5px;
  height:5px;
  background:#ffe27b;
  border-radius:50%;
  box-shadow:0 0 12px #ffe27b;
  animation:blink 2s infinite alternate;
}

.s1{left:15%;top:25%}
.s2{left:25%;top:65%;animation-delay:.5s}
.s3{right:18%;top:30%;animation-delay:1s}
.s4{right:30%;top:70%;animation-delay:1.5s}
.s5{left:45%;top:15%;animation-delay:.8s}

@keyframes blink{
  from{opacity:.15;transform:scale(.5)}
  to{opacity:1;transform:scale(1.5)}
}

/* ---------- CONTENT ---------- */

.content{
  position:relative;
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

/* ---------- POOKALAM ---------- */

.pookalam-wrap{
  position:absolute;
  width:min(62vw,430px);
  aspect-ratio:1;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:1.6s ease;
  z-index:10;
}

.pookalam{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      #f4a900 0 8deg,
      #fff0a3 8deg 16deg,
      #d84315 16deg 24deg
    );
  border:12px solid #f8cf51;
  box-shadow:
    0 0 0 8px #174b35,
    0 0 45px #ffd45a,
    0 0 90px rgba(255,210,80,.6);
  transition:1.8s cubic-bezier(.2,.8,.2,1);
}

/* flower layers */

.pookalam:before{
  content:"";
  position:absolute;
  inset:14%;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      #e85d04 0 12deg,
      #ffd166 12deg 24deg,
      #fff4bd 24deg 36deg,
      #d62828 36deg 48deg
    );
  border:10px dotted #fff1a8;
}

.pookalam:after{
  content:"✦";
  position:absolute;
  inset:32%;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:
    radial-gradient(circle,#fff5b8,#f6b719 45%,#c76b16);
  border:8px solid #fff0a3;
  color:#fff8d2;
  font-size:45px;
  box-shadow:0 0 25px #fff0a3;
}

/* ---------- CLICK TEXT ---------- */

.click{
  position:absolute;
  bottom:-65px;
  color:#fff5c4;
  font-size:18px;
  letter-spacing:2px;
  animation:pulse 1.5s infinite;
  white-space:nowrap;
}

@keyframes pulse{
  50%{opacity:.45}
}

/* ---------- MAVElI ---------- */

.maveli{
  position:absolute;
  width:280px;
  height:430px;
  top:50%;
  left:50%;
  transform:translate(-50%,100%);
  opacity:0;
  transition:1.8s cubic-bezier(.2,.8,.2,1);
  z-index:4;
}

/* head */

.head{
  position:absolute;
  width:105px;
  height:110px;
  border-radius:48% 48% 45% 45%;
  background:#9b542d;
  left:87px;
  top:30px;
  z-index:5;
  box-shadow:inset -8px -8px 0 rgba(70,25,10,.15);
}

/* hair */

.hair{
  position:absolute;
  width:95px;
  height:50px;
  left:5px;
  top:-18px;
  background:#24180f;
  border-radius:50% 50% 30% 30%;
}

/* crown */

.crown{
  position:absolute;
  width:80px;
  height:38px;
  left:100px;
  top:0;
  background:linear-gradient(#ffd95c,#c98b13);
  clip-path:polygon(
    0 100%,10% 35%,28% 65%,
    50% 0,70% 65%,90% 35%,100% 100%
  );
  z-index:8;
  border-bottom:6px solid #fff0a1;
}

/* eyes */

.eye{
  position:absolute;
  width:12px;
  height:7px;
  border-bottom:3px solid #21130d;
  border-radius:50%;
  top:75px;
  z-index:8;
}

.eye.one{left:112px}
.eye.two{left:157px}

/* moustache */

.moustache{
  position:absolute;
  width:58px;
  height:22px;
  left:111px;
  top:93px;
  z-index:8;
}

.moustache:before,
.moustache:after{
  content:"";
  position:absolute;
  width:34px;
  height:17px;
  background:#24150e;
  border-radius:100% 0 100% 0;
}

.moustache:before{
  transform:rotate(18deg);
}

.moustache:after{
  right:0;
  transform:scaleX(-1) rotate(18deg);
}

/* body */

.body{
  position:absolute;
  width:130px;
  height:180px;
  left:75px;
  top:125px;
  background:#a85b32;
  border-radius:45px 45px 25px 25px;
}

/* white shawl */

.shawl{
  position:absolute;
  width:130px;
  height:45px;
  left:75px;
  top:130px;
  background:#fff8d9;
  transform:rotate(4deg);
  z-index:6;
  border-top:7px solid #e5b632;
  border-bottom:5px solid #e5b632;
}

/* arms */

.arm{
  position:absolute;
  width:42px;
  height:145px;
  background:#a85b32;
  border-radius:30px;
  top:135px;
  z-index:3;
}

.arm.left{
  left:45px;
  transform:rotate(25deg);
}

.arm.right{
  right:45px;
  transform:rotate(-25deg);
}

/* hands */

.hand{
  position:absolute;
  width:45px;
  height:45px;
  background:#a85b32;
  border-radius:50%;
  top:100px;
  z-index:7;
}

.hand.left{left:24px}
.hand.right{right:24px}

/* mundu */

.mundu{
  position:absolute;
  width:155px;
  height:100px;
  left:62px;
  top:270px;
  background:#fff7dc;
  border-bottom:9px solid #d7a728;
  clip-path:polygon(5% 0,95% 0,100% 100%,0 100%);
  z-index:5;
}

/* legs */

.leg{
  position:absolute;
  width:43px;
  height:90px;
  background:#a85b32;
  top:345px;
  border-radius:25px;
}

.leg.left{left:82px}
.leg.right{right:82px}

/* ornaments */

.necklace{
  position:absolute;
  width:70px;
  height:25px;
  left:105px;
  top:145px;
  border:5px solid #ffd447;
  border-radius:50%;
  z-index:8;
}

/* ---------- OPEN STATE ---------- */

#open:checked ~ .scene .pookalam-wrap{
  transform:scale(.65) rotate(540deg);
  opacity:.15;
  pointer-events:none;
}

#open:checked ~ .scene .click{
  opacity:0;
}

#open:checked ~ .scene .maveli{
  transform:translate(-50%,-50%);
  opacity:1;
  animation:maveliFloat 3s ease-in-out 1.8s infinite;
}

@keyframes maveliFloat{
  0%,100%{margin-top:0}
  50%{margin-top:-8px}
}

/* ---------- WISH ---------- */

.wish{
  position:absolute;
  bottom:7%;
  text-align:center;
  opacity:0;
  transform:translateY(30px);
  transition:1.5s 2s ease;
  z-index:20;
  width:90%;
}

#open:checked ~ .scene .wish{
  opacity:1;
  transform:translateY(0);
}

.wish h1{
  font-size:clamp(28px,5vw,52px);
  color:#fff3bd;
  text-shadow:0 3px 12px #40200d;
  margin-bottom:12px;
}

.wish p{
  font-size:clamp(14px,2.2vw,21px);
  line-height:1.8;
  color:#fff;
}

/* ---------- PETALS ---------- */

.petal{
  position:absolute;
  width:12px;
  height:20px;
  background:#ffd34e;
  border-radius:100% 0 100% 0;
  opacity:0;
}

#open:checked ~ .scene .petal{
  opacity:1;
  animation:fall 4s linear infinite;
}

.p1{left:15%;top:20%;animation-delay:0s}
.p2{left:30%;top:10%;animation-delay:1s}
.p3{right:20%;top:15%;animation-delay:2s}
.p4{right:35%;top:30%;animation-delay:1.5s}
.p5{left:45%;top:5%;animation-delay:.5s}

@keyframes fall{
  0%{transform:translateY(-50px) rotate(0)}
  100%{transform:translateY(100vh) rotate(720deg)}
}

/* ---------- LAMP ---------- */

.lamp{
  position:absolute;
  bottom:5%;
  width:55px;
  height:18px;
  background:#d89b20;
  border-radius:50%;
  z-index:15;
}

.lamp.left{left:18%}
.lamp.right{right:18%}

.flame{
  position:absolute;
  width:18px;
  height:30px;
  background:#ffd84d;
  border-radius:50% 0 50% 50%;
  transform:rotate(45deg);
  left:18px;
  top:-28px;
  box-shadow:0 0 25px #ffb300;
  animation:flame 1s infinite alternate;
}

@keyframes flame{
  to{transform:rotate(40deg) scale(1.12)}
}

/* ---------- MOBILE ---------- */

@media(max-width:600px){
  .pookalam-wrap{
    width:72vw;
  }

  .maveli{
    transform:translate(-50%,100%) scale(.78);
  }

  #open:checked ~ .scene .maveli{
    transform:translate(-50%,-50%) scale(.78);
  }

  .palm{
    height:50vh;
  }

  .wish{
    bottom:3%;
  }
}
</style>
</head>

<body>

<!-- CSS-only interaction -->
<input type="checkbox" id="open">

<div class="scene">

  <div class="sky"></div>

  <!-- Kerala silhouettes -->
  <div class="palm left"></div>
  <div class="palm right"></div>

  <!-- Fireflies -->
  <i class="spark s1"></i>
  <i class="spark s2"></i>
  <i class="spark s3"></i>
  <i class="spark s4"></i>
  <i class="spark s5"></i>

  <!-- Falling petals -->
  <i class="petal p1"></i>
  <i class="petal p2"></i>
  <i class="petal p3"></i>
  <i class="petal p4"></i>
  <i class="petal p5"></i>

  <div class="content">

    <!-- POOKALAM -->
    <label for="open" class="pookalam-wrap">
      <div class="pookalam"></div>
      <div class="click">🌸 പൂക്കളം തുറക്കാൻ സ്പർശിക്കൂ 🌸</div>
    </label>

    <!-- MAVElI -->
    <div class="maveli">

      <div class="crown"></div>

      <div class="head">
        <div class="hair"></div>
      </div>

      <div class="eye one"></div>
      <div class="eye two"></div>

      <div class="moustache"></div>

      <div class="body"></div>

      <div class="shawl"></div>

      <div class="arm left"></div>
      <div class="arm right"></div>

      <div class="hand left"></div>
      <div class="hand right"></div>

      <div class="necklace"></div>

      <div class="mundu"></div>

      <div class="leg left"></div>
      <div class="leg right"></div>

    </div>

    <!-- ONAM WISH -->
    <div class="wish">
      <h1>🌸 ഹൃദയം നിറഞ്ഞ ഓണാശംസകൾ 🌸</h1>

      <p>
        സ്നേഹത്തിന്റെയും സമത്വത്തിന്റെയും സമൃദ്ധിയുടെയും<br>
        ഈ പൊന്നോണത്തിൽ എല്ലാവർക്കും<br>
        സന്തോഷവും സമാധാനവും നിറഞ്ഞ ഓണാശംസകൾ! ✨
      </p>
    </div>

  </div>

  <!-- Nilavilakku -->
  <div class="lamp left">
    <div class="flame"></div>
  </div>

  <div class="lamp right">
    <div class="flame"></div>
  </div>

</div>

</body>
</html>
